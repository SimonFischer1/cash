<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SURF CLUB POS — Cash</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="topbar">
        <a class="brand" href="#">
          <div class="logo">SC</div>
          <div>
            <div class="brand-name">SURF CLUB POS</div>
            <div class="brand-sub">Schnell · Klar · Schön</div>
          </div>
        </a>
        <div class="top-controls">
          <label class="label-inline">Mitarbeiter</label>
          <input id="employee" class="staff-input" value="Simon">
          <button id="book-table" class="btn btn-outline">Tisch buchen</button>
          <button id="start-btn" class="btn btn-primary">Loslegen</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section>
        <div class="panel">
          <div class="categories" role="tablist" id="categories"></div>

          <div class="product-grid" id="product-grid" aria-live="polite">
            <!-- rendered by JS -->
          </div>
        </div>
      </section>

      <aside class="order-drawer panel" id="order-drawer">
        <div class="order-header">
          <h3>Bon</h3>
          <div class="order-controls">
            <button id="clear-order" class="icon-btn" title="Bon leeren" aria-label="Bon leeren">✖</button>
          </div>
        </div>

        <div class="order-list" id="order-list">
          <div class="empty">Keine Artikel — wähle Produkte links aus.</div>
        </div>

        <div class="order-summary">
          <div class="tax-row"><span>MwSt. 7%</span><span id="vat7">0.00 €</span></div>
          <div class="tax-row"><span>MwSt. 19%</span><span id="vat19">0.00 €</span></div>
          <hr>
          <div class="total-row"><span>Gesamt</span><strong id="total">0.00 €</strong></div>
        </div>

        <div class="order-actions">
          <button id="pay-card" class="btn btn-primary">Kartenzahlung</button>
          <button id="pay-cash" class="btn btn-outline">Barzahlung</button>
        </div>
      </aside>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>© <span id="year"></span> Cash</div>
        <div class="footer-links"><a href="#">Datenschutz</a><a href="#">Impressum</a></div>
      </div>
    </footer>
  </div>

  <!-- Modals: payment & signature -->
  <div id="modal-root"></div>

  <script>
    // Data model
    const data = {
      categories: ['Ausrüstung','Kleidung','Getränke','Essen'],
      products: {
        'Ausrüstung':[ {id:'p1',name:'Wakeboard',price:20.0,vat:19}, {id:'p2',name:'Weste',price:10.0,vat:19} ],
        'Kleidung':[ {id:'p3',name:'T-Shirt Herren',price:25,vat:19} ],
        'Getränke':[ {id:'p4',name:'Cola',price:3.5,vat:7}, {id:'p5',name:'Fanta',price:3.5,vat:7} ],
        'Essen':[ {id:'p6',name:'Breze',price:2.5,vat:7}, {id:'p7',name:'Brötchen Käse',price:4.5,vat:7}, {id:'p8',name:'Brötchen Schinken',price:4.9,vat:7} ]
      }
    };

    // Cart state
    let cart = [];

    function formatMoney(n){ return n.toFixed(2).replace('.',',') + ' €'; }

    // Render categories as tappable buttons
    const categoriesEl = document.getElementById('categories');
    function renderCategories(){
      categoriesEl.innerHTML = '';
      data.categories.forEach((c, idx)=>{
        const btn = document.createElement('button');
        btn.className = 'cat' + (idx===0? ' active':'');
        btn.textContent = c;
        btn.dataset.category = c;
        btn.addEventListener('click', ()=>{ document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); renderProducts(c); });
        categoriesEl.appendChild(btn);
      });
    }

    // Render product grid
    const productGrid = document.getElementById('product-grid');
    function renderProducts(category){
      const list = data.products[category] || [];
      productGrid.innerHTML = '';
      list.forEach(p=>{
        const card = document.createElement('button');
        card.className = 'product-card';
        card.innerHTML = `<div class="p-title">${p.name}</div><div class="p-price">${formatMoney(p.price)}</div>`;
        card.addEventListener('click', ()=>{ addToCart(p); pulse(card); });
        productGrid.appendChild(card);
      });
    }

    // Add to cart
    function addToCart(product){
      const existing = cart.find(i=>i.id===product.id);
      if(existing){ existing.qty += 1; }
      else { cart.push({ ...product, qty:1 }); }
      renderCart();
    }

    // Render cart
    function renderCart(){
      const orderList = document.getElementById('order-list');
      orderList.innerHTML = '';
      if(cart.length===0){ orderList.innerHTML = '<div class="empty">Keine Artikel — wähle Produkte links aus.</div>'; updateTotals(); return; }
      cart.forEach(item=>{
        const row = document.createElement('div'); row.className = 'order-item';
        row.innerHTML = `<div class="left"><strong>${item.qty}x</strong> ${item.name}<div class="meta">MwSt. ${item.vat}%</div></div><div class="right"><div>${formatMoney(item.price*item.qty)}</div><div class="row-actions"><button class='small' aria-label='+' data-id='${item.id}'>+</button><button class='small' aria-label='-' data-id='${item.id}'>−</button></div></div>`;
        orderList.appendChild(row);
      });
      // attach qty handlers
      orderList.querySelectorAll('button.small').forEach(btn=>{
        btn.addEventListener('click',(e)=>{
          const id = btn.dataset.id;
          const it = cart.find(i=>i.id===id);
          if(!it) return;
          if(btn.textContent === '+'){ it.qty++; } else { it.qty--; if(it.qty<=0) cart = cart.filter(x=>x.id!==id); }
          renderCart();
        });
      });
      updateTotals();
    }

    function updateTotals(){
      const vat7 = cart.filter(i=>i.vat===7).reduce((s,i)=>s + (i.price*i.qty - (i.price*i.qty)/1.07),0);
      const vat19 = cart.filter(i=>i.vat===19).reduce((s,i)=>s + (i.price*i.qty - (i.price*i.qty)/1.19),0);
      const total = cart.reduce((s,i)=>s + i.price*i.qty,0);
      document.getElementById('vat7').textContent = formatMoney(vat7);
      document.getElementById('vat19').textContent = formatMoney(vat19);
      document.getElementById('total').textContent = formatMoney(total);
      return { total, vat7, vat19 };
    }

    function clearOrder(){ cart = []; renderCart(); }

    function pulse(el){ el.classList.add('added'); setTimeout(()=>el.classList.remove('added'),380); }

    // Payment flows & signature capture
    const modalRoot = document.getElementById('modal-root');

    function openPayment(type){
      const { total } = updateTotals();
      if(total <= 0){ alert('Wähle zuerst Produkte aus.'); return; }
      // show payment modal
      modalRoot.innerHTML = `
        <div class='modal-backdrop'>
          <div class='modal'>
            <h3>Zahlung — ${type}</h3>
            <div class='field'><label>Betrag</label><div class='big'>${formatMoney(total)}</div></div>
            <div class='field'><label>Erhalten</label><input id='pay-received' type='number' step='0.01' value='${total.toFixed(2)}'></div>
            <div class='field'><label>Zahlungsart</label><select id='pay-method'><option>Kartenzahlung</option><option>Barzahlung</option></select></div>
            <div class='modal-actions'><button id='confirm-pay' class='btn btn-primary'>Bezahlen & Unterschrift</button><button id='cancel-pay' class='btn btn-outline'>Abbrechen</button></div>
          </div>
        </div>`;
      document.getElementById('cancel-pay').addEventListener('click', closeModal);
      document.getElementById('confirm-pay').addEventListener('click', ()=>{
        const received = parseFloat(document.getElementById('pay-received').value || 0);
        const method = document.getElementById('pay-method').value;
        closeModal();
        // after payment, require signature for invoices/bookings
        openSignature({received, method});
      });
    }

    function openSignature(payment){
      modalRoot.innerHTML = `
        <div class='modal-backdrop'>
          <div class='modal large'>
            <h3>Unterschrift des Kunden</h3>
            <div class='sign-area'><canvas id='sig-canvas'></canvas></div>
            <div class='sign-actions'><button id='sign-clear' class='btn btn-outline'>Löschen</button><button id='sign-confirm' class='btn btn-primary'>Bestätigen</button><button id='sign-cancel' class='btn btn-outline'>Abbrechen</button></div>
          </div>
        </div>`;
      const canvas = document.getElementById('sig-canvas');
      setupSignatureCanvas(canvas);
      document.getElementById('sign-clear').addEventListener('click', ()=>{ const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); });
      document.getElementById('sign-cancel').addEventListener('click', closeModal);
      document.getElementById('sign-confirm').addEventListener('click', ()=>{
        const dataUrl = canvas.toDataURL('image/png');
        closeModal();
        // generate invoice page
        const employee = document.getElementById('employee').value || '—';
        generateInvoicePage({payment, signature:dataUrl, employee});
        clearOrder();
      });
    }

    function closeModal(){ modalRoot.innerHTML = ''; }

    function setupSignatureCanvas(canvas){
      const rect = () => { const ratio = window.devicePixelRatio || 1; canvas.width = canvas.offsetWidth * ratio; canvas.height = canvas.offsetHeight * ratio; const ctx = canvas.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#0b1220'; };
      canvas.style.width = '100%'; canvas.style.height = '200px';
      rect(); window.addEventListener('resize', rect);
      const ctx = canvas.getContext('2d');
      let drawing=false; let last={x:0,y:0};
      function pos(e){ const r=canvas.getBoundingClientRect(); if(e.touches){ return {x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top}; } return {x: e.clientX - r.left, y: e.clientY - r.top}; }
      function down(e){ drawing=true; last=pos(e); }
      function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; }
      function up(){ drawing=false; }
      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
      canvas.addEventListener('touchstart', down); canvas.addEventListener('touchmove', move); window.addEventListener('touchend', up);
    }

    // Invoice generation (opens new window / printable)
    function generateInvoicePage({payment, signature, employee}){
      const { total, vat7, vat19 } = updateTotals();
      const itemsHtml = cart.map(i=>`<tr><td>${i.name}</td><td style="text-align:center">${i.qty}</td><td style="text-align:right">${formatMoney(i.price)}</td><td style="text-align:right">${formatMoney(i.price*i.qty)}</td></tr>`).join('');
      const received = (payment && payment.received) ? payment.received : parseFloat((document.getElementById('total').textContent || '0').replace(/[€ ]/g,'').replace(',','.'));
      const method = (payment && payment.method) ? payment.method : (payment && payment.method) || '—';
      const change = received - total;
      const company = 'Surf Club GmbH';
      const html = `
        <html><head><meta charset='utf-8'><title>Rechnung</title><style>body{font-family:Inter,Arial,Helvetica,sans-serif;padding:24px;color:#0b1220}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee}footer{margin-top:20px;font-size:0.9rem;color:#666}</style></head><body>
        <h2>${company}</h2>
        <div>Bedient von: ${employee}</div>
        <h3>Rechnung</h3>
        <table><thead><tr><th>Produkt</th><th style="text-align:center">Menge</th><th style="text-align:right">Preis</th><th style="text-align:right">Summe</th></tr></thead><tbody>${itemsHtml}</tbody></table>
        <div style='margin-top:12px'><div> MwSt. 7%: ${formatMoney(vat7)}</div><div> MwSt. 19%: ${formatMoney(vat19)}</div></div>
        <h3>Gesamt: ${formatMoney(total)}</h3>
        <div>Zahlungsart: ${method}</div>
        <div>Erhalten: ${formatMoney(received || total)}</div>
        <div>Rückgeld: ${formatMoney(change || 0)}</div>
        <h4>Unterschrift</h4>
        <div><img src='${signature}' style='max-width:320px;border:1px solid #eee'></div>
        <footer>Vielen Dank für Ihren Einkauf.</footer>
        </body></html>`;
      const w = window.open('','_blank');
      w.document.open(); w.document.write(html); w.document.close();
    }

    // Event hooks
    document.getElementById('clear-order').addEventListener('click', ()=>{ if(confirm('Bon wirklich leeren?')) clearOrder(); });
    document.getElementById('pay-card').addEventListener('click', ()=> openPayment('Kartenzahlung'));
    document.getElementById('pay-cash').addEventListener('click', ()=> openPayment('Barzahlung'));
    document.getElementById('book-table').addEventListener('click', ()=>{
      // direct booking flow -> require signature and create invoice-like record
      if(cart.length===0){ alert('Wähle zuerst Produkte.'); return; }
      openSignature({received: null, method: 'Tisch-Buchung'});
    });

    // start
    renderCategories(); renderProducts(data.categories[0]); renderCart();
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
