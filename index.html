<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>SURF CLUB POS — Cash</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="topbar">
        <a class="brand" href="#">
          <div class="logo">SC</div>
          <div class="brand-text">
            <div class="brand-name">SURF CLUB POS</div>
            <div class="brand-sub">Schnell · Klar · Schön</div>
          </div>
        </a>
        <div class="top-controls">
          <input id="employee" class="staff-input" value="Simon" placeholder="Mitarbeiter">
          <button id="book-table" class="btn-icon" type="button" title="Tisch buchen">📋</button>
          <button id="start-btn" class="btn-primary" type="button">✓</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <!-- Mobile Tab Navigation -->
      <div class="mobile-nav">
        <button class="nav-tab active" data-tab="products">Produkte</button>
        <button class="nav-tab" data-tab="order">Bon</button>
      </div>

      <!-- Products Tab -->
      <div class="tab-pane active" id="tab-products">
        <div class="categories" id="categories"></div>
        <div class="product-grid" id="product-grid"></div>
      </div>

      <!-- Order Tab -->
      <div class="tab-pane" id="tab-order">
        <div class="order-header">
          <h2>Bon</h2>
          <button id="clear-order" class="btn-icon" type="button" title="Bon leeren">🧹</button>
        </div>
        <div class="order-items" id="order-list"></div>
        <div class="order-summary">
          <div class="summary-row"><span>MwSt. 7%</span><span id="vat7">0,00 €</span></div>
          <div class="summary-row"><span>MwSt. 19%</span><span id="vat19">0,00 €</span></div>
          <div class="summary-divider"></div>
          <div class="summary-total"><span>Gesamt</span><span id="total">0,00 €</span></div>
        </div>
        <div class="order-buttons">
          <button id="pay-card" class="btn-action btn-primary" type="button">Karte</button>
          <button id="pay-cash" class="btn-action" type="button">Bar</button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div>© <span id="year"></span> SURF CLUB POS</div>
    </footer>
  </div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <script>
    const data = {
      categories: ['Ausrüstung','Kleidung','Getränke','Essen'],
      products: {
        'Ausrüstung': [{id:'p1',name:'Wakeboard',price:20.00,vat:19}, {id:'p2',name:'Weste',price:10.00,vat:19}],
        'Kleidung': [{id:'p3',name:'T-Shirt Herren',price:25.00,vat:19}],
        'Getränke': [{id:'p4',name:'Cola',price:3.50,vat:7}, {id:'p5',name:'Fanta',price:3.50,vat:7}],
        'Essen': [{id:'p6',name:'Breze',price:2.50,vat:7}, {id:'p7',name:'Brötchen Käse',price:4.50,vat:7}, {id:'p8',name:'Brötchen Schinken',price:4.90,vat:7}]
      }
    };

    let cart = [];
    let bookedTables = {};

    // Utils
    function fmt(n) { return (Math.round(n*100)/100).toFixed(2).replace('.',',') + ' €'; }

    // Tab Navigation
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      });
    });

    // Categories
    function renderCats() {
      const el = document.getElementById('categories');
      el.innerHTML = '';
      data.categories.forEach((c, i) => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (i === 0 ? ' active' : '');
        btn.textContent = c;
        btn.type = 'button';
        btn.addEventListener('click', () => {
          document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
          btn.classList.add('active');
          renderProds(c);
        });
        el.appendChild(btn);
      });
    }

    // Products
    function renderProds(cat) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      (data.products[cat] || []).forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'product-btn';
        btn.type = 'button';
        btn.innerHTML = `<div>${p.name}</div><div class="price">${fmt(p.price)}</div>`;
        btn.addEventListener('click', () => {
          addCart(p);
          btn.classList.add('pulse');
          setTimeout(() => btn.classList.remove('pulse'), 300);
        });
        grid.appendChild(btn);
      });
    }

    // Cart
    function addCart(p) {
      const ex = cart.find(i => i.id === p.id);
      if (ex) ex.qty++;
      else cart.push({...p, qty: 1});
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('order-list');
      list.innerHTML = '';
      if (!cart.length) {
        list.innerHTML = '<div class="empty-cart">Keine Artikel</div>';
        updateTotals();
        return;
      }
      cart.forEach(item => {
        const row = document.createElement('div');
        row.className = 'order-row';
        row.innerHTML = `
          <div class="order-left">
            <div class="order-qty">${item.qty}x</div>
            <div class="order-name">${item.name}</div>
          </div>
          <div class="order-right">
            <div class="order-price">${fmt(item.price * item.qty)}</div>
            <div class="order-controls">
              <button class="btn-mini" data-id="${item.id}" data-op="inc">+</button>
              <button class="btn-mini" data-id="${item.id}" data-op="dec">−</button>
            </div>
          </div>`;
        list.appendChild(row);
      });
      list.querySelectorAll('.btn-mini').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const op = btn.dataset.op;
          const it = cart.find(i => i.id === id);
          if (!it) return;
          if (op === 'inc') it.qty++;
          else {
            it.qty--;
            if (it.qty <= 0) cart = cart.filter(i => i.id !== id);
          }
          renderCart();
        });
      });
      updateTotals();
    }

    function updateTotals() {
      const v7 = cart.filter(i => i.vat === 7).reduce((s, i) => s + (i.price*i.qty - (i.price*i.qty)/1.07), 0);
      const v19 = cart.filter(i => i.vat === 19).reduce((s, i) => s + (i.price*i.qty - (i.price*i.qty)/1.19), 0);
      const tot = cart.reduce((s, i) => s + i.price*i.qty, 0);
      document.getElementById('vat7').textContent = fmt(v7);
      document.getElementById('vat19').textContent = fmt(v19);
      document.getElementById('total').textContent = fmt(tot);
      return {tot, v7, v19};
    }

    // Modals
    const modal = document.getElementById('modal-container');

    function closeModal() { modal.innerHTML = ''; }

    function showCashPayment() {
      const {tot} = updateTotals();
      if (tot <= 0) { alert('Produkte wählen'); return; }
      modal.innerHTML = `
        <div class="modal-bg">
          <div class="modal-box">
            <h3>Barzahlung</h3>
            <div class="modal-field">
              <label>Betrag</label>
              <div class="modal-amount">${fmt(tot)}</div>
            </div>
            <div class="modal-field">
              <label>Erhalten</label>
              <input type="number" id="cash-input" step="0.01" value="${tot.toFixed(2)}" inputmode="decimal">
            </div>
            <div class="modal-field">
              <label>Rückgeld</label>
              <div class="modal-amount" id="cash-change">${fmt(0)}</div>
            </div>
            <div class="modal-buttons">
              <button class="btn-cancel" type="button">Zurück</button>
              <button class="btn-primary" type="button">Weiter</button>
            </div>
          </div>
        </div>`;
      
      const inp = document.getElementById('cash-input');
      const chg = document.getElementById('cash-change');
      inp.addEventListener('input', () => {
        const r = parseFloat(inp.value || 0);
        chg.textContent = fmt(Math.max(0, r - tot));
      });
      inp.focus();
      
      document.querySelector('.btn-cancel').addEventListener('click', closeModal);
      document.querySelector('.btn-primary').addEventListener('click', () => {
        const rec = parseFloat(inp.value || 0);
        closeModal();
        showSignature({rec, met: 'Barzahlung'});
      });
    }

    function showCardPayment() {
      const {tot} = updateTotals();
      if (tot <= 0) { alert('Produkte wählen'); return; }
      modal.innerHTML = `
        <div class="modal-bg">
          <div class="modal-box">
            <h3>Kartenzahlung</h3>
            <div class="modal-field">
              <label>Betrag</label>
              <div class="modal-amount">${fmt(tot)}</div>
            </div>
            <div class="modal-buttons">
              <button class="btn-cancel" type="button">Zurück</button>
              <button class="btn-primary" type="button">Weiter</button>
            </div>
          </div>
        </div>`;
      document.querySelector('.btn-cancel').addEventListener('click', closeModal);
      document.querySelector('.btn-primary').addEventListener('click', () => {
        closeModal();
        showSignature({rec: tot, met: 'Kartenzahlung'});
      });
    }

    function showTableBooking() {
      if (!cart.length) { alert('Produkte wählen'); return; }
      modal.innerHTML = `
        <div class="modal-bg">
          <div class="modal-box">
            <h3>Tisch buchen</h3>
            <div class="modal-field">
              <label>Tischnummer</label>
              <input type="number" id="table-input" min="1" inputmode="numeric">
            </div>
            <div class="modal-buttons">
              <button class="btn-cancel" type="button">Zurück</button>
              <button class="btn-primary" type="button">Buchen</button>
            </div>
          </div>
        </div>`;
      
      const inp = document.getElementById('table-input');
      inp.focus();
      document.querySelector('.btn-cancel').addEventListener('click', closeModal);
      document.querySelector('.btn-primary').addEventListener('click', () => {
        const tbl = inp.value;
        if (!tbl) { alert('Nummer eingeben'); return; }
        if (!bookedTables[tbl]) bookedTables[tbl] = [];
        bookedTables[tbl].push([...cart]);
        alert(`Tisch ${tbl} ✓`);
        cart = [];
        renderCart();
        closeModal();
      });
    }

    function showSignature(pay) {
      const {tot, v7, v19} = updateTotals();
      const items = [...cart];
      
      const itemsHtml = items.map(i => `<div class="sig-item"><span>${i.qty}x ${i.name}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('');
      
      modal.innerHTML = `
        <div class="modal-bg full">
          <div class="modal-box modal-sig">
            <h3>Unterschrift</h3>
            
            <div class="sig-order">
              ${itemsHtml}
              <div class="sig-totals">
                <div class="sig-item"><span>MwSt. 7%</span><span>${fmt(v7)}</span></div>
                <div class="sig-item"><span>MwSt. 19%</span><span>${fmt(v19)}</span></div>
                <div class="sig-item sig-total"><span>Gesamt</span><span>${fmt(tot)}</span></div>
              </div>
            </div>

            <div class="sig-tip">
              <h4>TIP</h4>
              <div class="tip-buttons">
                <button class="tip-opt" data-val="5">5%</button>
                <button class="tip-opt" data-val="10">10%</button>
                <button class="tip-opt" data-val="custom">Individuell</button>
              </div>
              <div id="tip-custom" class="tip-custom" style="display:none">
                <div class="tip-types">
                  <label><input type="radio" name="ttype" value="pct" checked> %</label>
                  <label><input type="radio" name="ttype" value="eur"> €</label>
                  <label><input type="radio" name="ttype" value="rnd"> Aufrunden</label>
                </div>
                <input type="number" id="tip-val" step="0.01" inputmode="decimal">
                <div id="tip-preview"></div>
              </div>
              <div class="tip-total" id="tip-display">${fmt(tot)}</div>
            </div>

            <div class="sig-canvas-box">
              <canvas id="sig-canvas"></canvas>
            </div>
            
            <div class="modal-buttons">
              <button class="btn-clear" type="button">Löschen</button>
              <button class="btn-cancel" type="button">Zurück</button>
              <button class="btn-primary" type="button">OK</button>
            </div>
          </div>
        </div>`;
      
      const canvas = document.getElementById('sig-canvas');
      const ctx = canvas.getContext('2d');
      
      // Properly size canvas
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0B1220';
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      let drawing = false;
      let lastX = 0, lastY = 0;
      
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches) {
          return {x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top};
        }
        return {x: e.clientX - rect.left, y: e.clientY - rect.top};
      }
      
      function down(e) {
        e.preventDefault();
        drawing = true;
        const p = getPos(e);
        lastX = p.x;
        lastY = p.y;
      }
      
      function move(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastX = p.x;
        lastY = p.y;
      }
      
      function up(e) {
        drawing = false;
      }
      
      canvas.addEventListener('mousedown', down);
      canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
      canvas.addEventListener('touchstart', down);
      canvas.addEventListener('touchmove', move);
      window.addEventListener('touchend', up);
      
      let tip = 0;
      
      function updateTipDisplay() {
        const disp = document.getElementById('tip-display');
        if (tip > 0) {
          disp.textContent = fmt(tot + tip);
        } else {
          disp.textContent = fmt(tot);
        }
      }
      
      document.querySelectorAll('.tip-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tip-opt').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (btn.dataset.val === 'custom') {
            document.getElementById('tip-custom').style.display = 'block';
          } else {
            document.getElementById('tip-custom').style.display = 'none';
            tip = tot * (parseFloat(btn.dataset.val) / 100);
            updateTipDisplay();
          }
        });
      });
      
      document.getElementById('tip-val').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value || 0);
        const ttype = document.querySelector('input[name="ttype"]:checked').value;
        const prv = document.getElementById('tip-preview');
        if (ttype === 'pct') {
          tip = tot * (val / 100);
          prv.textContent = `${val}% = ${fmt(tip)}`;
        } else if (ttype === 'eur') {
          tip = val;
          prv.textContent = fmt(val);
        } else if (ttype === 'rnd') {
          const rnd = Math.ceil(tot / 5) * 5;
          tip = rnd - tot;
          prv.textContent = `${fmt(tot)} → ${fmt(rnd)}`;
        }
        updateTipDisplay();
      });
      
      document.querySelectorAll('input[name="ttype"]').forEach(r => {
        r.addEventListener('change', () => {
          document.getElementById('tip-val').value = '';
          document.getElementById('tip-preview').textContent = '';
          tip = 0;
          updateTipDisplay();
        });
      });
      
      document.querySelector('.btn-clear').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
      
      document.querySelector('.btn-cancel').addEventListener('click', closeModal);
      
      document.querySelector('.btn-primary').addEventListener('click', () => {
        const blank = document.createElement('canvas');
        blank.width = canvas.width;
        blank.height = canvas.height;
        if (canvas.toDataURL() === blank.toDataURL()) {
          alert('Unterschrift erforderlich');
          return;
        }
        closeModal();
        printInvoice({pay, sig: canvas.toDataURL('image/png'), emp: document.getElementById('employee').value || '—', items, tip, tot: tot + tip});
        cart = [];
        renderCart();
      });
    }

    function printInvoice(data) {
      const now = new Date();
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth()+1).padStart(2, '0');
      const y = now.getFullYear();
      const fname = `Rechnung_${d}.${m}.${y}_${(data.tot).toFixed(2).replace('.', ',')}€`;
      
      const v7 = data.items.filter(i => i.vat === 7).reduce((s, i) => s + (i.price*i.qty - (i.price*i.qty)/1.07), 0);
      const v19 = data.items.filter(i => i.vat === 19).reduce((s, i) => s + (i.price*i.qty - (i.price*i.qty)/1.19), 0);
      const tot = data.items.reduce((s, i) => s + i.price*i.qty, 0);
      
      const itemsHtml = data.items.map(i => `<tr><td>${i.name}</td><td style="text-align:center">${i.qty}</td><td style="text-align:right">${fmt(i.price)}</td><td style="text-align:right">${fmt(i.price*i.qty)}</td></tr>`).join('');
      
      const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${fname}</title><style>
        body{font-family:Arial,sans-serif;padding:20px;color:#0b1220}
        table{width:100%;border-collapse:collapse;margin:20px 0}
        td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
        th{background:#f5f5f5;font-weight:bold}
        .header{display:flex;justify-content:space-between;margin-bottom:20px}
        .amount{font-weight:bold;font-size:1.2em;margin:10px 0}
        img{max-width:300px;border:1px solid #ccc;margin:10px 0}
        .footer{margin-top:20px;color:#666;font-size:0.9em}
      </style></head><body>
      <div class="header"><div><strong>Surf Club GmbH</strong><div>Adresse</div></div><div><strong>Rechnung</strong><div>${now.toLocaleString('de-DE')}</div></div></div>
      <h3>Produkte</h3>
      <table><thead><tr><th>Produkt</th><th style="text-align:center">Menge</th><th style="text-align:right">Einzelpreis</th><th style="text-align:right">Summe</th></tr></thead><tbody>${itemsHtml}</tbody></table>
      <div style="margin:10px 0"><div>MwSt. 7%: ${fmt(v7)}</div><div>MwSt. 19%: ${fmt(v19)}</div></div>
      <div class="amount">Gesamt: ${fmt(tot)}</div>
      <div>Zahlungsart: ${data.pay.met}</div>
      ${data.tip > 0 ? `<div><strong>TIP: ${fmt(data.tip)}</strong></div>` : ''}
      <div class="amount">Gesamtbetrag: ${fmt(data.tot)}</div>
      ${data.pay.met === 'Barzahlung' ? `<div>Erhalten: ${fmt(data.pay.rec)}</div><div>Rückgeld: ${fmt(Math.max(0, data.pay.rec - tot))}</div>` : ''}
      <h4>Unterschrift</h4>
      <img src="${data.sig}">
      <div class="footer">Bedient von: ${data.emp} — Surf Club GmbH</div>
      <script>window.onload=()=>setTimeout(()=>window.print(),100)<\/script>
      </body></html>`;
      
      const w = window.open('', '_blank');
      if (!w) { alert('Popup blockiert'); return; }
      w.document.write(html);
      w.document.close();
    }

    // Events
    document.getElementById('clear-order').addEventListener('click', () => {
      if (confirm('Bon leeren?')) { cart = []; renderCart(); }
    });
    document.getElementById('pay-cash').addEventListener('click', showCashPayment);
    document.getElementById('pay-card').addEventListener('click', showCardPayment);
    document.getElementById('book-table').addEventListener('click', showTableBooking);

    // Init
    renderCats();
    renderProds(data.categories[0]);
    renderCart();
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
