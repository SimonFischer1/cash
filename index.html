<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SURF CLUB POS — Cash</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="SURF CLUB POS — Startseite">
        <div class="logo-mark" aria-hidden="true">SC</div>
        <div class="brand-text">
          <div class="brand-name">SURF CLUB POS</div>
          <div class="brand-sub">Schnell. Klar. Schön.</div>
        </div>
      </a>

      <div class="header-mid">
        <div class="staff">
          <label class="staff-label">Mitarbeiter</label>
          <input class="staff-input" value="Simon" aria-label="Mitarbeiter">
        </div>
      </div>

      <div class="header-actions">
        <button class="btn btn-ghost btn-icon" id="theme-toggle" aria-label="Theme wechseln">🌗</button>
        <button class="btn btn-primary" id="cta-top">Loslegen</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="products" aria-label="Produkte">
      <div class="container products-inner">
        <div class="categories" role="tablist" aria-label="Produktkategorien">
          <button class="cat active" role="tab">Ausrüstung</button>
          <button class="cat" role="tab">Kleidung</button>
          <button class="cat" role="tab">Getränke</button>
          <button class="cat" role="tab">Essen</button>
        </div>

        <div class="product-grid" id="product-grid" aria-live="polite">
          <!-- Beispiellisten: ersetzen durch dynamische Daten im Produktivsystem -->
          <button class="product-card">
            <div class="p-title">Breze</div>
            <div class="p-price">2.50 €</div>
          </button>

          <button class="product-card">
            <div class="p-title">Brötchen Käse</div>
            <div class="p-price">4.50 €</div>
          </button>

          <button class="product-card">
            <div class="p-title">Brötchen Schinken</div>
            <div class="p-price">4.90 €</div>
          </button>

          <button class="product-card">
            <div class="p-title">Brötchen Salami</div>
            <div class="p-price">4.90 €</div>
          </button>

          <button class="product-card">
            <div class="p-title">Brötchen Vegan</div>
            <div class="p-price">4.50 €</div>
          </button>

          <button class="product-card">
            <div class="p-title">Fanta</div>
            <div class="p-price">3.50 €</div>
          </button>
        </div>

      </div>
    </section>

    <aside id="order-drawer" class="order-drawer" aria-label="Bon">
      <div class="order-header">
        <h3>Bon</h3>
        <div class="order-controls">
          <button class="btn btn-ghost btn-icon" id="clear-order" title="Bon leeren">🧹</button>
          <button class="btn btn-ghost btn-icon" id="close-order" title="Bon schließen">✖</button>
        </div>
      </div>

      <div class="order-list" id="order-list">
        <div class="empty">Keine Artikel — wähle Produkte links aus.</div>
      </div>

      <div class="order-summary">
        <div class="tax-line">MwSt. 7%: <span id="vat-7">0.00 €</span></div>
        <div class="tax-line">MwSt. 19%: <span id="vat-19">0.00 €</span></div>
        <div class="order-total">Gesamt: <span id="total">0.00 €</span></div>
      </div>

      <div class="order-actions">
        <button class="btn btn-success">Kartenzahlung</button>
        <button class="btn btn-warning">Barzahlung</button>
      </div>
    </aside>

    <div id="bottom-summary" class="bottom-summary" aria-hidden="true">
      <div class="sum-text">Gesamt: <strong id="total-bottom">0.00 €</strong></div>
      <div class="bottom-actions">
        <button class="btn btn-primary" id="pay-card">Kartenzahlung</button>
        <button class="btn btn-outline" id="pay-cash">Barzahlung</button>
        <button class="btn btn-ghost btn-icon" id="open-order-mobile" aria-label="Bon öffnen">🧾</button>
      </div>
    </div>

  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div>© <span id="year"></span> Cash</div>
      <div class="footer-links">
        <a href="#">Datenschutz</a>
        <a href="#">Impressum</a>
      </div>
    </div>
  </footer>

  <script>
    // Minimal client-side behaviour: animated microinteractions + order list demo
    document.getElementById('year').textContent = new Date().getFullYear();

    const root = document.documentElement;
    const productCards = document.querySelectorAll('.product-card');
    const orderList = document.getElementById('order-list');
    const totalEl = document.getElementById('total');
    const totalBottom = document.getElementById('total-bottom');
    const vat7 = document.getElementById('vat-7');
    const vat19 = document.getElementById('vat-19');

    let orderItems = [];

    function format(euro){
      return euro.toFixed(2).replace('.',',') + ' €';
    }

    function recalc(){
      let total = orderItems.reduce((s,i)=>s+i.price,0);
      let vat7val = orderItems.filter(i=>i.vat===7).reduce((s,i)=>s+i.price*0.07,0);
      let vat19val = orderItems.filter(i=>i.vat===19).reduce((s,i)=>s+i.price*0.19,0);
      totalEl.textContent = format(total);
      totalBottom.textContent = format(total);
      vat7.textContent = format(vat7val);
      vat19.textContent = format(vat19val);
    }

    function renderOrder(){
      orderList.innerHTML = '';
      if(orderItems.length === 0){
        orderList.innerHTML = '<div class="empty">Keine Artikel — wähle Produkte links aus.</div>';
        return;
      }
      orderItems.forEach((it, idx) => {
        const row = document.createElement('div');
        row.className = 'order-item';
        row.innerHTML = `<div class="o-left">${it.qty}x ${it.title}<div class="o-meta">MwSt. ${it.vat}%</div></div><div class="o-right">${format(it.price)}</div>`;
        row.addEventListener('click', ()=>{
          // remove on click (demo behaviour)
          orderItems.splice(idx,1);
          renderOrder(); recalc();
        });
        orderList.appendChild(row);
      });
    }

    // Demo prices and VAT mapping
    const demoMap = {
      'Breze': {price:2.5, vat:7},
      'Brötchen Käse': {price:4.5, vat:7},
      'Brötchen Schinken': {price:4.9, vat:7},
      'Brötchen Salami': {price:4.9, vat:7},
      'Brötchen Vegan': {price:4.5, vat:7},
      'Fanta': {price:3.5, vat:7}
    };

    productCards.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const title = btn.querySelector('.p-title').textContent.trim();
        const info = demoMap[title] || {price:5.0, vat:19};
        orderItems.push({title, price:info.price, vat:info.vat, qty:1});
        renderOrder(); recalc();

        // pulse animation
        btn.classList.add('added');
        setTimeout(()=>btn.classList.remove('added'),380);

        // on small screens show bottom-summary
        if(window.matchMedia('(max-width:640px)').matches){
          document.getElementById('bottom-summary').setAttribute('aria-hidden','false');
        }
      });
    });

    // Drawer controls
    const orderDrawer = document.getElementById('order-drawer');
    const openMobile = document.getElementById('open-order-mobile');
    const closeOrder = document.getElementById('close-order');
    const clearOrder = document.getElementById('clear-order');

    function openOrder(){ orderDrawer.classList.add('open'); }
    function closeOrderFn(){ orderDrawer.classList.remove('open'); }

    openMobile && openMobile.addEventListener('click', openOrder);
    closeOrder && closeOrder.addEventListener('click', closeOrderFn);
    clearOrder && clearOrder.addEventListener('click', ()=>{ orderItems = []; renderOrder(); recalc(); });

    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeOrderFn(); });

    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const stored = localStorage.getItem('cash:theme');
    if(stored === 'dark') root.classList.add('theme-dark');
    themeToggle && themeToggle.addEventListener('click', ()=>{
      const dark = root.classList.toggle('theme-dark');
      localStorage.setItem('cash:theme', dark ? 'dark' : 'light');
    });

    // Improve UX: detect pointer type
    if(window.matchMedia('(pointer:coarse)').matches){
      document.documentElement.classList.add('pointer-coarse');
    }
  </script>
</body>
</html>
