<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,viewport-fit=cover,user-scalable=no" />
  <title>SURF CLUB POS — Cash</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="topbar">
        <a class="brand" href="#">
          <div class="logo">SC</div>
          <div>
            <div class="brand-name">SURF CLUB POS</div>
            <div class="brand-sub">Schnell · Klar · Schön</div>
          </div>
        </a>
        <div class="top-controls">
          <label class="label-inline">Mitarbeiter</label>
          <input id="employee" class="staff-input" value="Simon">
          <button id="book-table" class="btn btn-outline" type="button">Tisch buchen</button>
          <button id="start-btn" class="btn btn-primary" type="button">Loslegen</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <section>
        <div class="panel">
          <div class="categories" role="tablist" id="categories"></div>

          <div class="product-grid" id="product-grid" aria-live="polite">
            <!-- rendered by JS -->
          </div>
        </div>
      </section>

      <aside class="order-drawer panel" id="order-drawer">
        <div class="order-header">
          <h3>Bon</h3>
          <div class="order-controls">
            <button id="clear-order" class="icon-btn" title="Bon leeren" aria-label="Bon leeren" type="button">🧹</button>
          </div>
        </div>

        <div class="order-list" id="order-list">
          <div class="empty">Keine Artikel — wähle Produkte links aus.</div>
        </div>

        <div class="order-summary">
          <div class="tax-row"><span>MwSt. 7%</span><span id="vat7">0,00 €</span></div>
          <div class="tax-row"><span>MwSt. 19%</span><span id="vat19">0,00 €</span></div>
          <hr>
          <div class="total-row"><span>Gesamt</span><strong id="total">0,00 €</strong></div>
        </div>

        <div class="order-actions">
          <button id="pay-card" class="btn btn-primary" type="button">Kartenzahlung</button>
          <button id="pay-cash" class="btn btn-outline" type="button">Barzahlung</button>
        </div>
      </aside>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>© <span id="year"></span> Cash</div>
        <div class="footer-links"><a href="#">Datenschutz</a><a href="#">Impressum</a></div>
      </div>
    </footer>
  </div>

  <!-- Modals: payment & signature -->
  <div id="modal-root"></div>

  <script>
    // --- Data model ---
    const data = {
      categories: ['Ausrüstung','Kleidung','Getränke','Essen'],
      products: {
        'Ausrüstung':[ {id:'p1',name:'Wakeboard',price:20.00,vat:19}, {id:'p2',name:'Weste',price:10.00,vat:19} ],
        'Kleidung':[ {id:'p3',name:'T-Shirt Herren',price:25.00,vat:19} ],
        'Getränke':[ {id:'p4',name:'Cola',price:3.50,vat:7}, {id:'p5',name:'Fanta',price:3.50,vat:7} ],
        'Essen':[ {id:'p6',name:'Breze',price:2.50,vat:7}, {id:'p7',name:'Brötchen Käse',price:4.50,vat:7}, {id:'p8',name:'Brötchen Schinken',price:4.90,vat:7} ]
      }
    };

    // --- Cart state ---
    let cart = [];

    function formatMoney(n){ return (Math.round(n*100)/100).toFixed(2).replace('.',',') + ' €'; }

    // --- Render categories ---
    const categoriesEl = document.getElementById('categories');
    function renderCategories(){
      categoriesEl.innerHTML = '';
      data.categories.forEach((c, idx)=>{
        const btn = document.createElement('button');
        btn.className = 'cat' + (idx===0? ' active':'');
        btn.type = 'button';
        btn.textContent = c;
        btn.dataset.category = c;
        btn.setAttribute('role','tab');
        btn.setAttribute('aria-selected', idx===0 ? 'true':'false');
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.cat').forEach(x=>{ x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
          btn.classList.add('active'); btn.setAttribute('aria-selected','true');
          renderProducts(c);
        });
        categoriesEl.appendChild(btn);
      });
    }

    // --- Render products ---
    const productGrid = document.getElementById('product-grid');
    function renderProducts(category){
      const list = data.products[category] || [];
      productGrid.innerHTML = '';
      list.forEach(p=>{
        const card = document.createElement('button');
        card.className = 'product-card';
        card.type = 'button';
        card.innerHTML = `<div class="p-title">${p.name}</div><div class="p-price">${formatMoney(p.price)}</div>`;
        card.addEventListener('click', ()=>{ addToCart(p); pulse(card); });
        productGrid.appendChild(card);
      });
    }

    // --- Cart operations ---
    function addToCart(product){
      const price = Number(product.price) || 0;
      const existing = cart.find(i=>i.id===product.id);
      if(existing){ existing.qty += 1; }
      else { cart.push({ id: product.id, name: product.name, price: price, vat: product.vat, qty: 1 }); }
      renderCart();
    }

    function renderCart(){
      const orderList = document.getElementById('order-list');
      orderList.innerHTML = '';
      if(cart.length===0){ orderList.innerHTML = '<div class="empty">Keine Artikel — wähle Produkte links aus.</div>'; updateTotals(); return; }
      cart.forEach(item=>{
        const row = document.createElement('div'); row.className = 'order-item';
        row.innerHTML = `
          <div class="left"><strong>${item.qty}x</strong> ${item.name}<div class="meta">MwSt. ${item.vat}%</div></div>
          <div class="right">
            <div>${formatMoney(item.price * item.qty)}</div>
            <div class="row-actions">
              <button class='small' type='button' aria-label='increase' data-action='inc' data-id='${item.id}'>+</button>
              <button class='small' type='button' aria-label='decrease' data-action='dec' data-id='${item.id}'>−</button>
            </div>
          </div>`;
        orderList.appendChild(row);
      });
      orderList.querySelectorAll('button.small').forEach(btn=>{
        btn.addEventListener('click',(e)=>{
          const action = btn.dataset.action; const id = btn.dataset.id;
          const it = cart.find(i=>i.id===id); if(!it) return;
          if(action === 'inc') it.qty++; else { it.qty--; if(it.qty<=0) cart = cart.filter(x=>x.id!==id); }
          renderCart();
        });
      });
      updateTotals();
    }

    function updateTotals(){
      const vat7 = cart.filter(i=>i.vat===7).reduce((s,i)=>s + (i.price*i.qty - (i.price*i.qty)/1.07),0);
      const vat19 = cart.filter(i=>i.vat===19).reduce((s,i)=>s + (i.price*i.qty - (i.price*i.qty)/1.19),0);
      const total = cart.reduce((s,i)=>s + i.price*i.qty,0);
      document.getElementById('vat7').textContent = formatMoney(vat7);
      document.getElementById('vat19').textContent = formatMoney(vat19);
      document.getElementById('total').textContent = formatMoney(total);
      return { total, vat7, vat19 };
    }

    function clearOrder(){ if(confirm('Bon wirklich leeren?')){ cart = []; renderCart(); } }

    function pulse(el){ el.classList.add('added'); setTimeout(()=>el.classList.remove('added'),380); }

    // --- Payment & Signature flow ---
    const modalRoot = document.getElementById('modal-root');

    function openCashPayment(){
      const { total } = updateTotals();
      if(total <= 0){ alert('Wähle zuerst Produkte aus.'); return; }
      modalRoot.innerHTML = `
        <div class='modal-backdrop'>
          <div class='modal'>
            <h3>Barzahlung</h3>
            <div class='field'><label>Betrag</label><div class='big'>${formatMoney(total)}</div></div>
            <div class='field'>
              <label>Erhalten</label>
              <input id='pay-received' type='number' step='0.01' value='${total.toFixed(2)}'>
            </div>
            <div class='field'>
              <label>Rückgeld</label>
              <div class='big' id='change-display'>${formatMoney(0)}</div>
            </div>
            <div class='modal-actions'>
              <button id='confirm-pay' class='btn btn-primary' type='button'>Bezahlen & Unterschrift</button>
              <button id='cancel-pay' class='btn btn-outline' type='button'>Abbrechen</button>
            </div>
          </div>
        </div>`;
      const receivedInput = document.getElementById('pay-received');
      const changeDisplay = document.getElementById('change-display');
      function updateChange(){
        const received = parseFloat(receivedInput.value || 0);
        const change = received - total;
        changeDisplay.textContent = formatMoney(Math.max(0, change));
      }
      receivedInput.addEventListener('input', updateChange);
      updateChange();
      document.getElementById('cancel-pay').addEventListener('click', closeModal);
      document.getElementById('confirm-pay').addEventListener('click', ()=>{
        const received = parseFloat(document.getElementById('pay-received').value || 0);
        closeModal();
        openSignature({received, method: 'Barzahlung'});
      });
    }

    function openCardPayment(){
      const { total } = updateTotals();
      if(total <= 0){ alert('Wähle zuerst Produkte aus.'); return; }
      modalRoot.innerHTML = `
        <div class='modal-backdrop'>
          <div class='modal'>
            <h3>Kartenzahlung</h3>
            <div class='field'><label>Betrag</label><div class='big'>${formatMoney(total)}</div></div>
            <div class='modal-actions'>
              <button id='confirm-pay' class='btn btn-primary' type='button'>Bezahlen & Unterschrift</button>
              <button id='cancel-pay' class='btn btn-outline' type='button'>Abbrechen</button>
            </div>
          </div>
        </div>`;
      document.getElementById('cancel-pay').addEventListener('click', closeModal);
      document.getElementById('confirm-pay').addEventListener('click', ()=>{
        closeModal();
        openSignature({received: total, method: 'Kartenzahlung'});
      });
    }

    function openSignature(payment){
      const { total, vat7, vat19 } = updateTotals();
      const invoiceCart = cart.map(i=>({ ...i }));
      
      const itemsHtml = invoiceCart.map(i=>`<div class='sig-item'><span>${i.qty}x ${i.name}</span><span>${formatMoney(i.price * i.qty)}</span></div>`).join('');
      
      modalRoot.innerHTML = `
        <div class='modal-backdrop'>
          <div class='modal large'>
            <h3>Unterschrift des Kunden</h3>
            
            <div class='sig-summary'>
              <div class='sig-summary-title'>Bestellung:</div>
              ${itemsHtml}
              <div style='border-top: 1px solid rgba(2,6,23,0.1); margin-top: 10px; padding-top: 10px;'>
                <div class='sig-item'><span>MwSt. 7%</span><span>${formatMoney(vat7)}</span></div>
                <div class='sig-item'><span>MwSt. 19%</span><span>${formatMoney(vat19)}</span></div>
                <div class='sig-item' style='font-weight: 700;'><span>Gesamt</span><span>${formatMoney(total)}</span></div>
              </div>
            </div>

            <div class='tip-section'>
              <div class='tip-title'>TIP</div>
              <div class='tip-options'>
                <button class='tip-btn' data-tip='5'>5% <span id='tip-5'></span></button>
                <button class='tip-btn' data-tip='10'>10% <span id='tip-10'></span></button>
                <button class='tip-btn' data-tip='custom'>Individuell</button>
              </div>
              <div class='tip-custom-section' id='tip-custom-section' style='display:none;'>
                <div class='tip-custom-options'>
                  <label><input type='radio' name='tip-custom-type' value='percent' checked> Prozentsatz</label>
                  <label><input type='radio' name='tip-custom-type' value='euro'> Euro-Betrag</label>
                  <label><input type='radio' name='tip-custom-type' value='round'> Aufrunden</label>
                </div>
                <input id='tip-custom-value' type='number' step='0.01' placeholder='Wert eingeben'>
                <div id='tip-custom-preview' style='margin-top: 8px; color: var(--muted);'></div>
              </div>
              <div class='tip-total' id='tip-total-display'></div>
            </div>

            <div class='sign-area'><canvas id='sig-canvas'></canvas></div>
            
            <div class='sign-actions'>
              <button id='sign-clear' class='btn btn-outline' type='button'>Löschen</button>
              <button id='sign-cancel' class='btn btn-outline' type='button'>Abbrechen</button>
              <button id='sign-confirm' class='btn btn-primary' type='button'>Bestätigen</button>
            </div>
          </div>
        </div>`;
      
      const canvas = document.getElementById('sig-canvas');
      setupSignatureCanvas(canvas);
      
      let selectedTip = 0;
      
      function updateTipDisplay(){
        document.getElementById('tip-5').textContent = `(${formatMoney(total * 0.05)})`;
        document.getElementById('tip-10').textContent = `(${formatMoney(total * 0.10)})`;
        const tipTotalEl = document.getElementById('tip-total-display');
        if(selectedTip > 0){
          tipTotalEl.textContent = `Total mit TIP: ${formatMoney(total + selectedTip)}`;
        } else {
          tipTotalEl.textContent = `Total: ${formatMoney(total)}`;
        }
      }
      updateTipDisplay();
      
      document.querySelectorAll('.tip-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.tip-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          const tipType = btn.dataset.tip;
          if(tipType === 'custom'){
            document.getElementById('tip-custom-section').style.display = 'block';
          } else {
            document.getElementById('tip-custom-section').style.display = 'none';
            selectedTip = total * (parseInt(tipType) / 100);
            updateTipDisplay();
          }
        });
      });
      
      document.getElementById('tip-custom-value').addEventListener('input', (e)=>{
        const value = parseFloat(e.target.value || 0);
        const customType = document.querySelector('input[name="tip-custom-type"]:checked').value;
        const preview = document.getElementById('tip-custom-preview');
        
        if(customType === 'percent'){
          selectedTip = total * (value / 100);
          preview.textContent = `${value}% = ${formatMoney(selectedTip)}`;
        } else if(customType === 'euro'){
          selectedTip = value;
          preview.textContent = `${formatMoney(value)}`;
        } else if(customType === 'round'){
          const rounded = Math.ceil(total / 5) * 5;
          selectedTip = rounded - total;
          preview.textContent = `${formatMoney(total)} → ${formatMoney(rounded)} (${formatMoney(selectedTip)})`;
        }
        updateTipDisplay();
      });
      
      document.querySelectorAll('input[name="tip-custom-type"]').forEach(radio=>{
        radio.addEventListener('change', ()=>{
          document.getElementById('tip-custom-value').value = '';
          document.getElementById('tip-custom-preview').textContent = '';
          selectedTip = 0;
          updateTipDisplay();
        });
      });
      
      document.getElementById('sign-clear').addEventListener('click', ()=>{ 
        const ctx=canvas.getContext('2d'); 
        ctx.clearRect(0,0,canvas.width,canvas.height); 
      });
      document.getElementById('sign-cancel').addEventListener('click', closeModal);
      document.getElementById('sign-confirm').addEventListener('click', ()=>{
        const blank = getBlankDataUrl(canvas);
        const dataUrl = canvas.toDataURL('image/png');
        if(dataUrl === blank){ alert('Bitte unterschreiben.'); return; }
        closeModal();
        const employee = document.getElementById('employee').value || '—';
        const finalTotal = total + selectedTip;
        generateInvoicePage({payment, signature:dataUrl, employee, invoiceCart, tip: selectedTip, finalTotal});
        cart = [];
        renderCart();
      });
    }

    function closeModal(){ modalRoot.innerHTML = ''; }

    function setupSignatureCanvas(canvas){
      canvas.style.width = '100%'; canvas.style.height = '240px';
      function resize(){ const ratio = Math.max(window.devicePixelRatio || 1,1); const w = canvas.offsetWidth; const h = canvas.offsetHeight; canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio); canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; const ctx = canvas.getContext('2d'); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2*ratio; ctx.strokeStyle='#0B1220'; }
      resize(); window.addEventListener('resize', resize);
      const ctx = canvas.getContext('2d'); let drawing=false; let last={x:0,y:0};
      function pos(e){ const r=canvas.getBoundingClientRect(); if(e.touches && e.touches.length) return {x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top}; return {x: e.clientX - r.left, y: e.clientY - r.top}; }
      function down(e){ e.preventDefault(); drawing=true; last=pos(e); }
      function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; }
      function up(){ drawing=false; }
      canvas.addEventListener('mousedown', down); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
      canvas.addEventListener('touchstart', down); canvas.addEventListener('touchmove', move); window.addEventListener('touchend', up);
    }

    function getBlankDataUrl(canvas){ const blank = document.createElement('canvas'); blank.width = canvas.width; blank.height = canvas.height; return blank.toDataURL('image/png'); }

    function generateInvoicePage({payment, signature, employee, invoiceCart, tip, finalTotal}){
      const vat7 = invoiceCart.filter(i=>i.vat===7).reduce((s,i)=>s + (i.price*i.qty - (i.price*i.qty)/1.07),0);
      const vat19 = invoiceCart.filter(i=>i.vat===19).reduce((s,i)=>s + (i.price*i.qty - (i.price*i.qty)/1.19),0);
      const total = invoiceCart.reduce((s,i)=>s + i.price*i.qty,0);
      const received = (payment && payment.received) ? payment.received : total;
      const change = received - total;
      const method = (payment && payment.method) ? payment.method : '—';
      const company = 'Surf Club GmbH';
      
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const dateStr = `${day}.${month}.${year}`;
      const betragStr = finalTotal.toFixed(2).replace('.', ',');
      const filename = `Rechnung_${dateStr}_${betragStr}€`;
      
      const itemsHtml = invoiceCart.map(i=>`<tr><td>${escapeHtml(i.name)}</td><td style="text-align:center">${i.qty}</td><td style="text-align:right">${formatMoney(i.price)}</td><td style="text-align:right">${formatMoney(i.price*i.qty)}</td></tr>`).join('');
      const html = `
        <html><head><meta charset='utf-8'><title>Rechnung</title><style>body{font-family:Arial,Helvetica,sans-serif;padding:18px;color:#0b1220}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}th{background:#f5f5f5;font-weight:bold}header{display:flex;justify-content:space-between;margin-bottom:20px}h3{margin:16px 0 8px 0}h4{margin:12px 0 8px 0}.amount{font-weight:bold;font-size:1.2em;margin:12px 0}</style></head><body>
        <header><div><strong>${company}</strong><div>Adresse</div></div><div><strong>Rechnung</strong><div>${now.toLocaleString('de-DE')}</div></div></header>
        <h3>Produkte</h3>
        <table><thead><tr><th>Produkt</th><th style="text-align:center">Menge</th><th style="text-align:right">Einzelpreis</th><th style="text-align:right">Summe</th></tr></thead><tbody>${itemsHtml}</tbody></table>
        <div style='margin-top:12px'><div>MwSt. 7%: ${formatMoney(vat7)}</div><div>MwSt. 19%: ${formatMoney(vat19)}</div></div>
        <div class='amount'>Gesamt: ${formatMoney(total)}</div>
        <div>Zahlungsart: ${escapeHtml(method)}</div>
        ${tip > 0 ? `<div><strong>TIP: ${formatMoney(tip)}</strong></div>` : ''}
        <div class='amount'>Gesamtbetrag: ${formatMoney(finalTotal)}</div>
        ${method === 'Barzahlung' ? `<div>Erhalten: ${formatMoney(received)}</div><div>R��ckgeld: ${formatMoney(change)}</div>` : ''}
        <h4>Unterschrift</h4>
        <div><img src='${signature}' style='max-width:320px;border:1px solid #eee'></div>
        <footer style='margin-top:18px;color:#666'>Bedient von: ${escapeHtml(employee)} — ${company}</footer>
        <script>window.onload = function(){ document.title = '${filename}'; setTimeout(function(){ window.print(); },120); };<\/script>
        </body></html>`;
      const w = window.open('','_blank');
      if(!w){ alert('Popup blockiert. Erlaube Popups für diese Seite.'); return; }
      w.document.open(); w.document.write(html); w.document.close();
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"]+/g, function(match){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[match]; }); }

    // --- Event hooks ---
    document.getElementById('clear-order').addEventListener('click', clearOrder);
    document.getElementById('pay-card').addEventListener('click', openCardPayment);
    document.getElementById('pay-cash').addEventListener('click', openCashPayment);
    document.getElementById('book-table').addEventListener('click', ()=>{
      if(cart.length===0){ alert('Wähle zuerst Produkte.'); return; }
      const tableNum = prompt('Tischnummer:');
      if(!tableNum) return;
      alert(`Tisch ${tableNum} gebucht!`);
    });

    // --- Start ---
    renderCategories(); renderProducts(data.categories[0]); renderCart(); document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
