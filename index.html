<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cash — POS (responsive)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="Cash — Startseite">
        <div class="logo-mark" aria-hidden="true">C</div>
        <span class="brand-name">SURF CLUB POS</span>
      </a>

      <div class="header-mid">
        <div class="store-name">Mitarbeiter <input class="staff-input" value="Simon" aria-label="Mitarbeiter"></div>
      </div>

      <div class="header-actions">
        <button class="btn btn-icon" id="order-toggle" aria-label="Bon anzeigen">🧾</button>
        <button class="btn btn-primary" id="cta-top">Jetzt starten</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="products" aria-label="Produkte">
      <div class="container">
        <div class="categories">
          <button class="cat active">Ausrüstung</button>
          <button class="cat">Kleidung</button>
          <button class="cat">Getränke</button>
          <button class="cat">Essen</button>
        </div>

        <div class="product-grid" id="product-grid">
          <!-- Example product cards -->
          <button class="product-card">
            <div class="p-title">Breze</div>
            <div class="p-price">2.50 €</div>
          </button>
          <button class="product-card">
            <div class="p-title">Brötchen Käse</div>
            <div class="p-price">4.50 €</div>
          </button>
          <button class="product-card">
            <div class="p-title">Brötchen Schinken</div>
            <div class="p-price">4.90 €</div>
          </button>
          <button class="product-card">
            <div class="p-title">Brötchen Salami</div>
            <div class="p-price">4.90 €</div>
          </button>
          <button class="product-card">
            <div class="p-title">Brötchen Vegetarisch</div>
            <div class="p-price">4.50 €</div>
          </button>
          <button class="product-card">
            <div class="p-title">Brötchen Vegan</div>
            <div class="p-price">4.50 €</div>
          </button>
        </div>

      </div>
    </section>

    <aside id="order-drawer" class="order-drawer" aria-label="Bon">
      <div class="order-header">
        <h3>Bon</h3>
        <button class="btn btn-icon" id="close-order" aria-label="Bon schließen">✖</button>
      </div>

      <div class="order-list" id="order-list">
        <!-- Items will be injected here or static examples -->
        <div class="order-item">
          <div class="o-left">1x Leash</div>
          <div class="o-right">5.00 €</div>
        </div>
        <div class="order-item">
          <div class="o-left">1x Wakeboard</div>
          <div class="o-right">20.00 €</div>
        </div>
        <div class="order-item muted">MwSt. 7%: 0.92 €</div>
        <div class="order-item total">Gesamt: <strong>156.50 €</strong></div>
      </div>

      <div class="order-actions">
        <button class="btn btn-success">Kartenzahlung</button>
        <button class="btn btn-warning">Barzahlung</button>
      </div>
    </aside>

    <div id="bottom-summary" class="bottom-summary">
      <div class="sum-text">Gesamt: <strong>156.50 €</strong></div>
      <div class="bottom-actions">
        <button class="btn btn-primary" id="pay-card">Kartenzahlung</button>
        <button class="btn btn-outline" id="pay-cash">Barzahlung</button>
        <button class="btn btn-icon" id="open-order-mobile" aria-label="Bon öffnen">🧾</button>
      </div>
    </div>

  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div>© <span id="year"></span> Cash</div>
      <div class="footer-links">
        <a href="#">Datenschutz</a>
        <a href="#">Impressum</a>
      </div>
    </div>
  </footer>

  <script>
    // Basic interactive behaviour for order drawer / mobile
    document.getElementById('year').textContent = new Date().getFullYear();
    const root = document.documentElement;
    const orderDrawer = document.getElementById('order-drawer');
    const orderToggle = document.getElementById('order-toggle');
    const closeOrder = document.getElementById('close-order');
    const openOrderMobile = document.getElementById('open-order-mobile');

    function openOrder() { orderDrawer.classList.add('open'); }
    function closeOrderFn() { orderDrawer.classList.remove('open'); }

    orderToggle.addEventListener('click', openOrder);
    closeOrder.addEventListener('click', closeOrderFn);
    openOrderMobile.addEventListener('click', openOrder);

    // Theme persistence (light/dark) - reuse from previous
    const themeToggle = document.getElementById('theme-toggle');
    if(themeToggle){
      const stored = localStorage.getItem('cash:theme');
      if(stored === 'dark') root.classList.add('theme-dark');
      themeToggle.addEventListener('click', ()=>{
        const dark = root.classList.toggle('theme-dark');
        localStorage.setItem('cash:theme', dark ? 'dark' : 'light');
      });
    }

    // Improve touch targets: when product card is clicked, temporarily animate
    document.querySelectorAll('.product-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        btn.classList.add('active');
        setTimeout(()=>btn.classList.remove('active'),160);
      });
    });

    // Accessibility: close drawer with escape
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape') closeOrderFn();
    });
  </script>
</body>
</html>
